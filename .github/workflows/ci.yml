name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: staynest
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: staynest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U staynest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --coverage
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: staynest
          DB_PASSWORD: testpass
          DB_NAME: staynest_test

      - name: Build
        run: npm run build

      - name: Build Docker image
        run: docker build -t staynest-api:ci .

      # Secret scanner
      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
